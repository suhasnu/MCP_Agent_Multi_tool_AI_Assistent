name: CI

# Runs the test suite on every push and pull request. The suite is hermetic:
# no network, no GROQ_API_KEY, no running MCP servers. External HTTP is mocked
# with respx, and the agent is faked in gateway tests. So CI needs no secrets.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check . --output-format=github

      - name: Run tests
        run: pytest -q